name: Build daily macro dashboard

on:
  schedule:
    - cron: "43 0 * * 1-6"  # Taiwan 08:43, Monday-Saturday
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install edge-tts
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts

      - name: Build static dashboard from Apps Script HTML
        env:
          DASHBOARD_HTML_SOURCE_URL: ${{ secrets.DASHBOARD_HTML_SOURCE_URL }}
          TODAY_DAILY_SOURCE_URL: ${{ secrets.TODAY_DAILY_SOURCE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
          ENABLE_DAILY_TTS: "true"
          DAILY_TTS_VOICE: zh-TW-YunJheNeural
          DAILY_TTS_RATE: "-8%"
          DAILY_TTS_VOLUME: "+0%"
          DAILY_TTS_PITCH: "-5Hz"
          FORCE_REBUILD_DAILY_AUDIO: "false"
        run: python scripts/build_daily_dashboard.py

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html history data assets/audio README.md || true

          git commit -m "Update daily macro dashboard HTML snapshot" || echo "No changes to commit"
          git push
