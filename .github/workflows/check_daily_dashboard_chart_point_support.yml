name: Check daily dashboard chart point support

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check deployed Apps Script HTML
        env:
          DASHBOARD_HTML_SOURCE_URL: ${{ secrets.DASHBOARD_HTML_SOURCE_URL }}
        run: |
          python scripts/check_daily_dashboard_chart_point_support.py

      - name: Upload check result
        uses: actions/upload-artifact@v4
        with:
          name: daily-dashboard-chart-point-support-check
          path: data/daily_dashboard_chart_point_support_check.json
          if-no-files-found: warn
